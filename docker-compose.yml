services:
  # 1. Vector Database Engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledgeflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # 2. FastAPI Retrieval Engine
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: knowledgeflow-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: always

  # 3. Streamlit User Interface
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: knowledgeflow-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_storage:
